# Default suite: 1000 GloVe word vectors under cosine through the ClusterANN format. Runs on every build alongside
# cohere-1k (inner product) and sift-1k (L2); the three cover one corpus per metric.
#
#   brazil-build single-test -DtestClass=org.opensearch.knn.vectorformats.codec.component.KNNVectorFormatsComponentTest \
#       -Dtests.extra.jvmargs="-Dknn.suite=src/test/resources/glove-1k-suite.yml"
#
# The corpus is committed at src/test/resources/dataset/glove-100-angular-sample1000-q1000-seed42.hdf5 (1.2 MB), so
# no build fetches anything. It was cut by the sampler out of ann-benchmarks glove-100-angular (train 1,183,514 x
# 100, test 10,000 x 100, 100 neighbours; 463 MB): 1000 seeded rows, exact ground truth for the first 1000 queries.
# To regenerate it (or the 10k sibling), see "Sampling a corpus" in the README:
#
#   brazil-build single-test -DtestClass=org.opensearch.knn.vectorformats.codec.component.corpus.Hdf5SamplerRun \
#       -Dtests.extra.jvmargs="-Dknn.sample.standard=true"
#
# ann-benchmarks "angular" is cosine distance. GloVe vectors are not unit length, so the sampler normalised the sampled
# vectors and queries to unit length before writing them (cosine is scale invariant, so the ground truth is the same
# as over the raw vectors); the quantized write path asserts unit vectors under cosine. Declaring dot_product here
# would score every query against different answers. Like cohere-1k, a smoke test at this size: its value is being
# the cosine corpus.

defaults:
  corpus:
    type: hdf5
    file: src/test/resources/dataset/glove-100-angular-sample1000-q1000-seed42.hdf5
    # Required: see above. Hdf5Corpus warns if this disagrees with the "angular" in the file name.
    similarity: cosine
    size: 1000
    queries: 1000

  index:
    # Four segments, so flushed scenarios span more than one and merged ones have something to merge.
    docsPerSegment: 250
    # Without this, Lucene's exact-search fallback would be reported as this format's recall.
    expectFiles: [clap, clac]

  search:
    k: 10
    queries: 200
    repeat: 1
    warmup: -1
    # Lucene's cosine score is (1 + cos) / 2, in [0, 1]. Measured maxima over 2000 hits: 0.21 at 1 bit, 0.20 at 2,
    # 0.13 at 4; mean signed error up to 0.04 at 1 bit, under 0.01 at 2 and 4. Per width below.
    scoreTolerance: 0.3
    scoreBias: 0.06

  codec:
    name: ClusterANN1030TestCodec
    params:
      quantization:
        # 1, 2 or 4 only.
        docBits: 1

scenarios:
  # Measured recall@10: 0.36 at 1 bit, 0.58 at 2, 0.82 at 4. GloVe is a hard corpus: word vectors fill the sphere
  # far more evenly than Cohere passages or SIFT patches, so 1000 of them cluster poorly and 1 bit loses most of it.
  - name: 1bit-flushed
  - name: 1bit-merged
    index: {forceMerge: 1}

  - name: 2bit-flushed
    search: {scoreTolerance: 0.3, scoreBias: 0.02}
    codec: {params: {quantization: {docBits: 2}}}
  - name: 2bit-merged
    index: {forceMerge: 1}
    search: {scoreTolerance: 0.3, scoreBias: 0.02}
    codec: {params: {quantization: {docBits: 2}}}

  - name: 4bit-flushed
    search: {scoreTolerance: 0.2, scoreBias: 0.02}
    codec: {params: {quantization: {docBits: 4}}}
  - name: 4bit-merged
    index: {forceMerge: 1}
    search: {scoreTolerance: 0.2, scoreBias: 0.02}
    codec: {params: {quantization: {docBits: 4}}}

  # Data-blind int8 (IVFaster style): Hadamard rotation + absolute maxAbs/127, no centroid residual. Hadamard is
  # orthonormal, so it preserves the unit norm cosine assumes. 8-bit codes are near-exact: measured max score error
  # 0.0016 over 2000 hits, mean signed -4e-5. Recall 0.9865 — a large jump over 4 bit's 0.81/0.825 on this hard corpus.
  - name: int8-flushed
    search: {scoreTolerance: 0.01, scoreBias: 0.001}
    codec: {params: {quantization: {encoding: DATA_BLIND_INT8, docBits: 8}}}
  - name: int8-merged
    index: {forceMerge: 1}
    search: {scoreTolerance: 0.01, scoreBias: 0.001}
    codec: {params: {quantization: {encoding: DATA_BLIND_INT8, docBits: 8}}}
