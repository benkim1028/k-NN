# Shard-level planning against per-segment planning (ShardPlanEvalRun) at realistic cluster counts (about 195
# clusters per 100k vectors). The same corpora, filters and k as the shard-budget evaluation. Opt-in; downloads on
# first use into knn.corpus.dir (Cohere 100k, 307 MB; the SIFT 1M file, 501 MB, of which the first 100k rows are
# indexed with exact ground truth recomputed over them).
#
#   ./gradlew clusterAnnTest --no-daemon --tests '*ShardPlanEvalRun' -Dknn.shardPlanEval=true \
#     -Dknn.suite=src/test/resources/shard-plan-100k-suite.yml

defaults:
  corpus:
    type: hdf5
    size: 100000
    queries: 1000
  index:
    docsPerSegment: 100000
    expectFiles: [clap, clac]
  search:
    k: 100
    queries: 500
    warmup: 50
  codec:
    name: ClusterANN1030TestCodec
    params:
      quantization: {encoding: DATA_BLIND_INT8, docBits: 8}

scenarios:
  - name: cohere-100k-int8
    corpus:
      file: https://dbyiw3u3rf9yr.cloudfront.net/corpora/vectorsearch/cohere-wikipedia-22-12-en-embeddings/documents-100k.hdf5.bz2
      similarity: maximum_inner_product
  - name: sift-100k-int8
    corpus: {file: http://ann-benchmarks.com/sift-128-euclidean.hdf5, similarity: euclidean}
